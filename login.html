<!doctype html>
<html lang="zh-CN">
<head><link rel="icon" href="assets/favicon.svg?v=4" type="image/svg+xml">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户登陆 · 酒店预订</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/login.js"></script>
</head>
<body class="login-page">
  <main class="login-main">
    <img class="login-background" src="assets/login/18849.svg" alt="">
    <div class="auth-stage" id="auth-stage" data-view="login">
    <section class="login-card auth-panel" id="login-panel" aria-labelledby="login-title">
      <h1 id="login-title">用户登陆</h1>
      <form id="login-form" novalidate>
        <div class="login-fields">
          <label class="login-field" for="login-user"><span>用户名</span><span class="login-input-wrap"><img src="assets/login/24a04.svg" alt=""><input id="login-user" name="username" autocomplete="username" value="wandajiaqi" required></span></label>
          <label class="login-field" for="login-password"><span>密码</span><span class="login-input-wrap"><img src="assets/login/24a04.svg" alt=""><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入" required minlength="6"></span></label>
          <label class="login-field" for="login-captcha"><span>验证码</span><span class="login-input-wrap login-captcha-wrap"><img src="assets/login/24a04.svg" alt=""><input id="login-captcha" name="captcha" placeholder="请输入" autocomplete="off" inputmode="numeric" maxlength="4" required><img class="login-captcha-image" src="assets/login/e679b.png" alt="验证码 4827"></span></label>
        </div>
        <p class="login-feedback" id="login-feedback" role="status" aria-live="polite"></p>
        <div class="login-footer"><img class="login-divider" src="assets/login/a935a.svg" alt=""><div class="login-links"><button type="button" id="login-register">免费注册</button><button type="button" id="login-employee">员工登陆</button></div><button type="submit" class="login-submit">确认登陆</button></div>
      </form>
    </section>
    <section class="register-card auth-panel" id="register-panel" aria-labelledby="register-title" aria-hidden="true" hidden inert>
      <form id="login-register-form" novalidate>
        <h1 id="register-title">新用户注册</h1>
        <div class="register-fields">
          <label class="register-field" for="register-company"><span>公司名称</span><input id="register-company" name="company" autocomplete="organization" placeholder="请输入公司名称" required></label>
          <label class="register-field" for="register-contact"><span>联系人姓名</span><input id="register-contact" name="contact" autocomplete="name" placeholder="请填写真实姓名" required></label>
          <label class="register-field" for="register-phone"><span>用户名</span><input id="register-phone" name="phone" type="tel" autocomplete="tel username" inputmode="numeric" maxlength="11" placeholder="手机号" required></label>
          <label class="register-field" for="register-code"><span>验证码</span><span class="register-code-control"><input id="register-code" name="code" autocomplete="one-time-code" inputmode="numeric" maxlength="4" placeholder="请输入验证码" required><button type="button" id="register-get-code">获取验证码</button></span></label>
          <label class="register-field" for="register-password"><span>设置密码</span><input id="register-password" name="newPassword" type="password" autocomplete="new-password" minlength="6" maxlength="16" placeholder="请设置6-16位登录密码" required></label>
          <label class="register-field" for="register-confirm"><span>确认密码</span><input id="register-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="16" placeholder="请确认密码" required></label>
        </div>
        <label class="register-agreement"><input type="checkbox" name="agreement" required><span>我已阅读并同意<a href="#cooperation-agreement" id="register-agreement-link">《合作协议》</a></span></label>
        <p class="register-feedback" id="login-register-feedback" role="status" aria-live="polite"></p>
        <footer class="register-footer"><button type="button" class="register-login" id="register-login">登录</button><button type="submit" class="login-submit register-submit">申请注册</button></footer>
      </form>
    </section>
    </div>
    <p class="login-copyright">©天下房仓提供技术支持 Designed by Fangcang.</p>
  </main>
</body>
</html>
